name: PostgreSQL Database Migration

on:
  workflow_dispatch:
    inputs:
      target_pg_url:
        description: 'Target PostgreSQL Connection String'
        required: false
        default: 'postgresql://muzo:muzo123@160.22.109.140:5432/muzo'
      source_db_user:
        description: 'Source Database User'
        required: false
        default: 'NJiLRqKxh1QG3am.root'
      source_db_name:
        description: 'Source Database Name'
        required: false
        default: 'test'

jobs:
  migrate:
    name: Execute MySQL to PostgreSQL Migration
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install mysql2 dotenv pg

      - name: Run Migration
        env:
          SOURCE_DB_HOST: ${{ secrets.SOURCE_DB_HOST || 'gateway01.ap-southeast-1.prod.aws.tidbcloud.com' }}
          SOURCE_DB_PORT: ${{ secrets.SOURCE_DB_PORT || '4000' }}
          SOURCE_DB_USER: ${{ github.event.inputs.source_db_user || secrets.SOURCE_DB_USER || 'NJiLRqKxh1QG3am.root' }}
          SOURCE_DB_PASSWORD: ${{ secrets.SOURCE_DB_PASSWORD || 'H6YEFIEODY97QvHQ' }}
          SOURCE_DB_NAME: ${{ github.event.inputs.source_db_name || secrets.SOURCE_DB_NAME || 'test' }}
          TARGET_PG_URL: ${{ github.event.inputs.target_pg_url || secrets.TARGET_PG_URL || 'postgresql://muzo:muzo123@160.22.109.140:5432/muzo' }}
        run: node migrate/migrate.js
