name: Fast Database Migration

on:
  workflow_dispatch:
    inputs:
      target_db_name:
        description: 'Target Database Name'
        required: false
        default: 'test'
      source_db_name:
        description: 'Source Database Name'
        required: false
        default: 'test'

jobs:
  migrate:
    name: Execute High-Speed TiDB Migration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install mysql2 dotenv

      - name: Run Migration
        env:
          SOURCE_DB_HOST: ${{ secrets.SOURCE_DB_HOST || 'gateway01.ap-southeast-1.prod.aws.tidbcloud.com' }}
          SOURCE_DB_PORT: ${{ secrets.SOURCE_DB_PORT || '4000' }}
          SOURCE_DB_USER: ${{ secrets.SOURCE_DB_USER || '3jmws3vjSEBzHAs.root' }}
          SOURCE_DB_PASSWORD: ${{ secrets.SOURCE_DB_PASSWORD || 'yB3MSU7tNyUAh84n' }}
          SOURCE_DB_NAME: ${{ github.event.inputs.source_db_name || secrets.SOURCE_DB_NAME || 'test' }}
          TARGET_DB_HOST: ${{ secrets.TARGET_DB_HOST || 'gateway01.ap-southeast-1.prod.aws.tidbcloud.com' }}
          TARGET_DB_PORT: ${{ secrets.TARGET_DB_PORT || '4000' }}
          TARGET_DB_USER: ${{ secrets.TARGET_DB_USER || 'NJiLRqKxh1QG3am.root' }}
          TARGET_DB_PASSWORD: ${{ secrets.TARGET_DB_PASSWORD || 'H6YEFIEODY97QvHQ' }}
          TARGET_DB_NAME: ${{ github.event.inputs.target_db_name || secrets.TARGET_DB_NAME || 'test' }}
        run: node migrate/migrate.js
